name: ProofRun Pages Demo

# Static SEE-only public demo. Separate from ProofRun CI (ci.yml).
# Does not run C++/Python product server. Does not deploy until Pages is enabled
# in repository Settings → Pages → Source: GitHub Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "viz/**"
      - "catalogs/**"
      - "python/proofrun_py/**"
      - "scripts/build_public_demo.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Build static public demo
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          PROOFRUN_PROJECT_ROOT: ${{ github.workspace }}
        run: python scripts/build_public_demo.py --base /proofrun/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
